server {
    listen 80;
    server_name _;

    location /auth/ {
        proxy_pass http://data-api:8090/auth/;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
    }

    location /pi-agent/ {
        proxy_pass http://pi-runtime:8091/;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_set_header X-Pi-Agent-Client $http_x_pi_agent_client;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
